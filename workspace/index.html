<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>LUMINA PRISM — 3D Product Showcase</title>
<link rel="icon" href="data:,">
<div class="brand-header" id="brandHeader"><span>LUMINA</span><span>PRISM</span></div>
<link rel="stylesheet" href="./style.css">
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/": "./vendor/"
  }
}
</script>
</head>
<body>
<canvas id="gl"></canvas>
<div class="hud" id="hud">
  <div class="hud-panel presets-panel">
    <span class="hud-label">CAMERAS</span>
    <button class="hud-btn" data-preset="hero">Hero</button>
    <button class="hud-btn" data-preset="top">Top</button>
    <button class="hud-btn" data-preset="detail">Detail</button>
  </div>
  <div class="hud-panel colorways-panel">
    <span class="hud-label">COLORWAY</span>
    <button class="hud-btn" data-colorway="obsidian">Obsidian</button>
    <button class="hud-btn" data-colorway="aurora">Aurora</button>
    <button class="hud-btn" data-colorway="ember">Ember</button>
  </div>
  <div class="hud-panel lighting-panel">
    <span class="hud-label">LIGHTING</span>
    <button class="hud-btn" data-lighting="studio">Studio</button>
    <button class="hud-btn" data-lighting="dramatic">Dramatic</button>
    <button class="hud-btn" data-lighting="ambient">Ambient</button>
  </div>
</div>
<script type="module" src="./main.js"></script>
</body>
</html>
